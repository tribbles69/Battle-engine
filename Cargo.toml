[workspace]
resolver = "2"
members = ["crates/fylking_sim", "crates/fylking_game"]
default-members = ["crates/fylking_game"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Bevy is slow in debug builds; optimise dependencies even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
