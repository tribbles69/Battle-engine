# Fylking unit types.
#
# Each [table] is one unit type; the table name is its id in scenario files.
# Add your own types here: the engine reads everything from this file.
#
#   men               soldiers in a full unit
#   hp                hit points per soldier
#   attack / defence  melee skill (higher attack = more hits landed, higher defence = fewer taken)
#   armour            reduces damage taken
#   damage            damage per hit
#   charge_bonus      extra attack + damage for a few seconds after running into contact
#   bonus_vs_mounted  % extra damage against cavalry; also lets the unit brace against charges
#   walk_speed / run_speed   metres per second
#   morale            base morale; the unit routs when current morale hits zero
#   mass              charge impact and shoving weight (infantry = 1)
#   radius            body radius in metres
#   reach             weapon reach in metres
#   attack_interval   seconds between swings
#   mounted           true for horse
#   spacing           metres between men in formation
#   files             default formation width (men per rank)

